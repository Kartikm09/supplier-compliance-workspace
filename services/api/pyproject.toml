[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "supplier-compliance-api"
version = "0.1.0"
description = "Document, risk, reporting, and supplier-import service for Supplier Compliance Workspace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "pypdf==6.14.2",
  "reportlab==4.4.10",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.0",
  "mypy==1.19.1",
  "pytest==9.1.1",
  "ruff==0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supplier_compliance_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["supplier_compliance_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
