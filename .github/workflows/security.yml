name: Security

on:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix packages/contracts
      - run: npm ci --prefix apps/web
      - run: npm audit --prefix apps/web --audit-level=high
      - run: node scripts/check-secrets.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: >
          python -m pip install --upgrade
          pip==26.1.2
          setuptools==83.0.0
      - run: pip install -e services/api pip-audit==2.10.1
      - run: pip-audit --local
