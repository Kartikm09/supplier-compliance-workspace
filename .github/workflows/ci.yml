name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/contracts/package-lock.json
      - run: npm ci --prefix packages/contracts
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix packages/contracts
      - run: npm run format:check --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: node scripts/check-secrets.mjs

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "services/api[dev]"
      - run: ruff format --check services/api
      - run: ruff check services/api
      - run: mypy services/api/src
      - run: pytest services/api

  database-and-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >
          supabase start
          -x edge-runtime,gotrue,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector
          --ignore-health-check
      - run: supabase test db
      - run: supabase db lint --level warning
      - run: deno fmt --check supabase/functions
      - run: deno lint --config supabase/functions/deno.json supabase/functions
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: deno test --config supabase/functions/deno.json --allow-env supabase/functions

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
